plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'   // processes google-services.json
}

android {
    namespace 'com.homelifesync.elder'
    compileSdk 34

    defaultConfig {
        applicationId "com.homelifesync.elder"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Google Play Services — Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Firebase BoM — pins all Firebase lib versions together
    implementation platform('com.google.firebase:firebase-bom:34.17.0')

    // FCM — push messaging (wakes the app even when killed)
    implementation 'com.google.firebase:firebase-messaging'

    // Realtime Database — commands + status sync
    implementation 'com.google.firebase:firebase-database'
}
